# B-05: 로그인 설정(.env)이 없는 빌드에서 Apple 로그인은 실패 안내를 띄우고 로그인 화면에 남는다. 로그인 확인은 B-27(Google), B-28(Apple)에서 한다
appId: com.pacemate.app
---
- openLink: pacemate://
- extendedWaitUntil: { visible: "Apple로 계속하기", timeout: 15000 }
- tapOn: "Apple로 계속하기"
- assertVisible: "로그인하지 못했어요.*"
- assertVisible: "Apple로 계속하기"
- takeScreenshot: b05-apple
