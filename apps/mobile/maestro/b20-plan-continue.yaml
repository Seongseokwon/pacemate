# B-20: 계획이 끝난 뒤 유지 계획 이어 가기(T-207). 기간이 끝난 계획이 있는 로그인 계정으로 실행한다(로컬 DB에서 end_date를 어제 이전으로 바꾼다)
# [새 목표 설정]은 계획을 바꾸므로 흐름 밖에서 다른 계정으로 본다
appId: com.pacemate.app
---
- openLink: pacemate://
- extendedWaitUntil: { visible: "이어서 훈련하기", timeout: 15000 }
- assertVisible: "새 목표 설정"
- takeScreenshot: b20-plan-ended
- tapOn: "이어서 훈련하기"
- extendedWaitUntil: { visible: "이 계획으로 시작", timeout: 15000 }
- takeScreenshot: b20-continuation-preview
- tapOn: "이 계획으로 시작"
- extendedWaitUntil: { notVisible: "이 계획으로 시작", timeout: 15000 }
- assertNotVisible: "이어서 훈련하기"
- takeScreenshot: b20-continuation-home
