# B-23: 로그인과 T-407 연결 후, 오늘 변경 가능한 훈련이 있는 계정으로 실행한다.
appId: com.pacemate.app
---
- openLink: pacemate://coach
- extendedWaitUntil: { visible: "메시지", timeout: 15000 }
- tapOn: "메시지"
- inputText: "오늘 너무 피곤해요. 오늘 훈련은 쉬고 싶어요"
- tapOn: "보내기"
- extendedWaitUntil: { visible: "일정 변경 제안", timeout: 90000 }
- takeScreenshot: b23-s3-proposal
- tapOn: "적용하기"
- extendedWaitUntil: { visible: "적용했어요", timeout: 15000 }
- takeScreenshot: b23-s3-applied
