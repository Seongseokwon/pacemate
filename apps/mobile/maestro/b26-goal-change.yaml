# B-26: 로그인 후 활성 5km 계획이 있는 계정으로 실행한다. 기존 기록은 지우지 않는다.
appId: com.pacemate.app
---
- openLink: pacemate://me
- extendedWaitUntil: { visible: "목표 바꾸기", timeout: 15000 }
- tapOn: "목표 바꾸기"
- assertVisible: "목표를 바꾸면 남은 계획이 새로 만들어져요. 지금까지의 기록과 진행률은 그대로 남아요."
- tapOn: "바꾸기"
- tapOn: "10km"
- tapOn: "다음"
- tapOn: "건너뛰기"
- tapOn: "건너뛰기"
- extendedWaitUntil: { visible: "변경 미리보기", timeout: 15000 }
- takeScreenshot: b26-goal-preview
- tapOn: "이 계획으로 시작"
- extendedWaitUntil: { visible: "계획을 바꿨어요", timeout: 15000 }
- takeScreenshot: b26-goal-applied
