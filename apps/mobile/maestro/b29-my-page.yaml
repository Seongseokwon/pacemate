# B-29: 마이페이지(T-503). 로그인한 계정으로 실행한다. 마지막에 로그아웃하므로 config.yaml의 맨 끝에 둔다
appId: com.pacemate.app
---
- openLink: pacemate://me
- extendedWaitUntil: { visible: "현재 요금제", timeout: 15000 }
- assertVisible: "무료"
- assertVisible: "AI 대화"
- assertVisible: "AI 일정 변경"
# 1단계 출시에는 구독으로 가는 버튼이 없다
- assertNotVisible: "Pro 알아보기"
- takeScreenshot: b29-my-page
- scrollUntilVisible: { element: "계정 삭제", direction: DOWN }
- takeScreenshot: b29-settings
# 구독 기록이 없는 계정에는 해지 안내가 없다
- tapOn: "계정 삭제"
- extendedWaitUntil: { visible: "계정을 삭제하면 아래 내용이 모두 지워지고 되돌릴 수 없어요.", timeout: 15000 }
- assertNotVisible: ".*스토어의 구독 관리에서 따로 해지.*"
- takeScreenshot: b29-delete-account
- tapOn: "뒤로"
# 로그아웃은 확인 창을 거친 뒤 로그인 화면으로 간다
- extendedWaitUntil: { visible: "로그아웃", timeout: 15000 }
- tapOn: "로그아웃"
- assertVisible: "로그아웃할까요?"
- takeScreenshot: b29-sign-out-dialog
- tapOn: { text: "로그아웃", index: 1 }
- extendedWaitUntil: { visible: "Google 계정으로 계속하기", timeout: 15000 }
- takeScreenshot: b29-after-sign-out
