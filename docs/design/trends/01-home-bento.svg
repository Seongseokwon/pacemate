<svg xmlns="http://www.w3.org/2000/svg" width="880" height="940" viewBox="0 0 880 940" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2938"/><stop offset="1" stop-color="#151C26"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient>
  </defs>
  <rect width="880" height="940" fill="#05080D"/>
  <text x="225" y="40" fill="#B4BCC8" font-size="18" text-anchor="middle" font-weight="700">현재 (C2)</text>
  <text x="655" y="40" fill="#FF8A5C" font-size="18" text-anchor="middle" font-weight="700">제안: 벤토형 홈 (P-01)</text>

  <!-- 현재 -->
  <g transform="translate(30,60)">
    <rect width="390" height="860" rx="44" fill="#0B1018" stroke="#252F3C"/>
    <text x="24" y="80" fill="#F3F5F8" font-size="28" font-weight="800">반가워요!</text>
    <text x="24" y="112" fill="#B4BCC8" font-size="15">5km 완주 준비 · 3주 차 / 전체 8주</text>
    <text x="24" y="150" fill="#B4BCC8" font-size="14">이번 주</text>
    <text x="366" y="150" fill="#F3F5F8" font-size="14" text-anchor="end">1/3회 완료 · 4km / 14km</text>
    <rect x="24" y="162" width="342" height="8" rx="4" fill="#252F3C"/><rect x="24" y="162" width="114" height="8" rx="4" fill="#FF5A1F"/>
    <rect x="24" y="196" width="342" height="170" rx="22" fill="url(#hero)" stroke="#252F3C"/>
    <rect x="40" y="212" width="96" height="26" rx="13" fill="#3A2419"/><text x="88" y="230" fill="#FF8A5C" font-size="12" text-anchor="middle" font-weight="700">오늘의 훈련</text>
    <circle cx="48" cy="262" r="5" fill="#8DBBFF"/><text x="60" y="268" fill="#F3F5F8" font-size="19" font-weight="800">가볍게 달리기</text>
    <text x="40" y="294" fill="#B4BCC8" font-size="13">4km · 대화할 수 있을 만큼 편한 속도</text>
    <rect x="40" y="310" width="310" height="42" rx="21" fill="url(#btn)"/><text x="195" y="337" fill="#0B1018" font-size="15" text-anchor="middle" font-weight="800">기록하기</text>
    <text x="24" y="410" fill="#F3F5F8" font-size="17" font-weight="800">이번 주</text>
    <g fill="#151C26" stroke="#252F3C"><rect x="24" y="426" width="342" height="58" rx="16"/><rect x="24" y="494" width="342" height="58" rx="16"/><rect x="24" y="562" width="342" height="58" rx="16"/></g>
    <g font-size="15" fill="#F3F5F8" font-weight="700"><text x="48" y="460">월 가볍게 달리기 4km</text><text x="48" y="528">목 가볍게 달리기 4km</text><text x="48" y="596">토 길게 달리기 6km</text></g>
    <rect x="300" y="442" width="50" height="26" rx="13" fill="#163329"/><text x="325" y="460" fill="#5FD39A" font-size="12" text-anchor="middle">완료</text>
    <rect x="300" y="510" width="50" height="26" rx="13" fill="#1E2733"/><text x="325" y="528" fill="#B4BCC8" font-size="12" text-anchor="middle">예정</text>
    <rect x="300" y="578" width="50" height="26" rx="13" fill="#1E2733"/><text x="325" y="596" fill="#B4BCC8" font-size="12" text-anchor="middle">예정</text>
    <text x="195" y="690" fill="#7D8899" font-size="13" text-anchor="middle">한 열로 길게 쌓여 스크롤이 길다</text>
    <rect x="0" y="780" width="390" height="80" rx="0" fill="#0B1018"/><line x1="0" y1="780" x2="390" y2="780" stroke="#252F3C"/>
    <g font-size="11" fill="#97A1B0" text-anchor="middle"><text x="39" y="822" fill="#FF8A5C">홈</text><text x="117" y="822">AI 코치</text><text x="195" y="822">캘린더</text><text x="273" y="822">기록</text><text x="351" y="822">마이</text></g>
  </g>

  <!-- 제안 -->
  <g transform="translate(460,60)">
