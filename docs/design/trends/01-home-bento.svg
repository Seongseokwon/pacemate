    <text x="24" y="80" fill="#F3F5F8" font-size="28" font-weight="800">반가워요!</text>
    <text x="24" y="112" fill="#B4BCC8" font-size="15">5km 완주 준비 · 3주 차 / 전체 8주</text>
    <!-- 히어로 -->
    <rect x="24" y="132" width="342" height="190" rx="24" fill="url(#hero)"/>
    <rect x="40" y="148" width="96" height="26" rx="13" fill="#3A2419"/><text x="88" y="166" fill="#FF8A5C" font-size="12" text-anchor="middle" font-weight="700">오늘의 훈련</text>
    <text x="40" y="232" fill="#F3F5F8" font-size="56" font-weight="800">4<tspan font-size="24" fill="#B4BCC8"> km</tspan></text>
    <circle cx="48" cy="256" r="5" fill="#8DBBFF"/><text x="60" y="261" fill="#F3F5F8" font-size="15" font-weight="700">가볍게 달리기 · 편한 속도</text>
    <path d="M250 230 C 270 170, 340 170, 330 205 S 300 250, 345 255" fill="none" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round"/>
    <rect x="40" y="272" width="310" height="38" rx="19" fill="url(#btn)"/><text x="195" y="297" fill="#0B1018" font-size="15" text-anchor="middle" font-weight="800">기록하기</text>
    <!-- 타일 2개 -->
