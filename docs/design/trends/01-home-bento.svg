    <text x="40" y="360" fill="#B4BCC8" font-size="13">이번 주</text>
    <path d="M56 448 A 50 50 0 0 1 156 448" fill="none" stroke="#252F3C" stroke-width="12" stroke-linecap="round"/>
    <path d="M56 448 A 50 50 0 0 1 81 405" fill="none" stroke="#FF5A1F" stroke-width="12" stroke-linecap="round"/>
    <text x="106" y="444" fill="#F3F5F8" font-size="26" font-weight="800" text-anchor="middle">1/3</text>
    <text x="106" y="472" fill="#B4BCC8" font-size="12" text-anchor="middle">회 완료</text>
    <rect x="201" y="334" width="165" height="150" rx="20" fill="#151C26"/>
    <text x="217" y="360" fill="#B4BCC8" font-size="13">이번 주 거리</text>
    <text x="217" y="410" fill="#F3F5F8" font-size="34" font-weight="800">4<tspan font-size="16" fill="#B4BCC8"> / 14km</tspan></text>
    <g fill="#1E2733"><rect x="217" y="440" width="14" height="28" rx="4"/><rect x="237" y="440" width="14" height="28" rx="4"/><rect x="257" y="440" width="14" height="28" rx="4"/><rect x="277" y="440" width="14" height="28" rx="4"/><rect x="297" y="440" width="14" height="28" rx="4"/><rect x="317" y="440" width="14" height="28" rx="4"/><rect x="337" y="440" width="14" height="28" rx="4"/></g>
    <rect x="217" y="448" width="14" height="20" rx="4" fill="#5FD39A"/><rect x="277" y="440" width="14" height="28" rx="4" fill="none" stroke="#FF5A1F" stroke-width="2"/>
    <!-- 코치 한마디 -->
    <rect x="24" y="496" width="342" height="104" rx="20" fill="#151C26"/>
    <circle cx="54" cy="528" r="16" fill="#FF8A3D"/><text x="54" y="533" fill="#0B1018" font-size="12" text-anchor="middle" font-weight="800">온이</text>
    <text x="80" y="524" fill="#F3F5F8" font-size="14" font-weight="700">월요일 기록 좋았어요.</text>
    <text x="80" y="544" fill="#B4BCC8" font-size="13">오늘도 숨이 차지 않게만 달려요.</text>
    <rect x="40" y="560" width="112" height="28" rx="14" fill="#1E2733"/><text x="96" y="579" fill="#F3F5F8" font-size="12" text-anchor="middle">코치에게 묻기</text>
    <rect x="160" y="560" width="112" height="28" rx="14" fill="#1E2733"/><text x="216" y="579" fill="#F3F5F8" font-size="12" text-anchor="middle">일정 바꾸기</text>
    <!-- 주간 줄 -->
    <text x="24" y="636" fill="#F3F5F8" font-size="17" font-weight="800">이번 주</text>
    <g font-size="12" fill="#B4BCC8" text-anchor="middle"><text x="48" y="666">월</text><text x="96" y="666">화</text><text x="144" y="666">수</text><text x="192" y="666" fill="#FF8A5C">목</text><text x="240" y="666">금</text><text x="288" y="666">토</text><text x="336" y="666">일</text></g>
    <circle cx="48" cy="690" r="9" fill="#5FD39A"/><circle cx="96" cy="690" r="4" fill="#334052"/><circle cx="144" cy="690" r="4" fill="#334052"/><circle cx="192" cy="690" r="9" fill="none" stroke="#FF5A1F" stroke-width="3"/><circle cx="240" cy="690" r="4" fill="#334052"/><circle cx="288" cy="690" r="9" fill="none" stroke="#C4A5FF" stroke-width="3"/><circle cx="336" cy="690" r="4" fill="#334052"/>
    <text x="195" y="736" fill="#7D8899" font-size="13" text-anchor="middle">첫 화면에 오늘·이번 주·코치가 모두 보인다</text>
    <!-- 떠 있는 탭 바 -->
    <rect x="24" y="772" width="342" height="60" rx="30" fill="#151C26" fill-opacity="0.92" stroke="#334052"/>
    <g font-size="11" fill="#97A1B0" text-anchor="middle"><rect x="36" y="780" width="64" height="44" rx="22" fill="#3A2419"/><text x="68" y="807" fill="#FF8A5C" font-weight="700">홈</text><text x="133" y="807">AI 코치</text><text x="195" y="807">캘린더</text><text x="257" y="807">기록</text><text x="322" y="807">마이</text></g>
  </g>
