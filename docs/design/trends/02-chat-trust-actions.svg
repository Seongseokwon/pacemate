<svg xmlns="http://www.w3.org/2000/svg" width="880" height="940" viewBox="0 0 880 940" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif">
  <defs><linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient></defs>
  <rect width="880" height="940" fill="#05080D"/>
  <text x="225" y="40" fill="#B4BCC8" font-size="18" text-anchor="middle" font-weight="700">현재 (12c)</text>
  <text x="655" y="40" fill="#FF8A5C" font-size="18" text-anchor="middle" font-weight="700">제안: 근거 한 줄 + 상황 칩 (P-02)</text>

  <!-- 현재 -->
  <g transform="translate(30,60)">
    <rect width="390" height="860" rx="44" fill="#0B1018" stroke="#252F3C"/>
    <circle cx="48" cy="80" r="22" fill="#FF8A3D"/><text x="82" y="78" fill="#F3F5F8" font-size="18" font-weight="800">온이 코치</text><text x="82" y="98" fill="#B4BCC8" font-size="12">AI 코치</text>
    <line x1="0" y1="120" x2="390" y2="120" stroke="#252F3C"/>
    <rect x="150" y="140" width="216" height="62" rx="20" fill="#FF5A1F"/><text x="166" y="166" fill="#0B1018" font-size="14">금요일부터 일요일까지요.</text><text x="166" y="188" fill="#0B1018" font-size="14">여행 중에는 못 달려요</text>
    <rect x="24" y="218" width="260" height="62" rx="20" fill="#151C26" stroke="#252F3C"/><text x="40" y="244" fill="#F3F5F8" font-size="14">여행 기간은 비워 두고,</text><text x="40" y="266" fill="#F3F5F8" font-size="14">길게 달리기를 목요일로 옮길게요.</text>
    <rect x="16" y="296" width="358" height="340" rx="24" fill="#151C26" stroke="#252F3C"/>
    <text x="36" y="330" fill="#F3F5F8" font-size="17" font-weight="800">일정 변경 제안</text>
    <rect x="32" y="348" width="326" height="58" rx="14" fill="#0B1018"/><text x="48" y="372" fill="#F3F5F8" font-size="14" font-weight="700">길게 달리기 6km</text><text x="48" y="394" fill="#B4BCC8" font-size="13">토 11/21  →  목 11/19</text>
    <rect x="32" y="414" width="326" height="58" rx="14" fill="#0B1018"/><text x="48" y="438" fill="#F3F5F8" font-size="14" font-weight="700">가볍게 달리기 4km</text><text x="48" y="460" fill="#B4BCC8" font-size="13">목 11/19  →  생략</text>
    <text x="36" y="500" fill="#B4BCC8" font-size="13">이번 주 거리</text><text x="354" y="500" fill="#F3F5F8" font-size="14" text-anchor="end" font-weight="700">14km → 10km</text>
    <rect x="32" y="516" width="326" height="36" rx="12" fill="#33290F"/><text x="48" y="539" fill="#FFC266" font-size="13">이번 주 훈련이 1회 줄어요</text>
    <rect x="32" y="566" width="156" height="44" rx="14" fill="#1E2733"/><text x="110" y="594" fill="#F3F5F8" font-size="14" text-anchor="middle" font-weight="700">다른 방법 보기</text>
    <rect x="200" y="566" width="158" height="44" rx="14" fill="url(#btn)"/><text x="279" y="594" fill="#0B1018" font-size="14" text-anchor="middle" font-weight="800">적용하기</text>
    <text x="195" y="680" fill="#7D8899" font-size="13" text-anchor="middle">왜 이렇게 바꾸는지 근거가 안 보인다</text>
    <rect x="16" y="740" width="290" height="44" rx="22" fill="none" stroke="#334052"/><text x="36" y="768" fill="#7D8899" font-size="14">메시지를 입력하세요</text>
    <circle cx="346" cy="762" r="22" fill="#3A2419"/>
  </g>

  <!-- 제안 -->
  <g transform="translate(460,60)">
    <rect width="390" height="860" rx="44" fill="#0B1018" stroke="#334052"/>
    <circle cx="48" cy="80" r="22" fill="#FF8A3D"/><text x="82" y="78" fill="#F3F5F8" font-size="18" font-weight="800">온이 코치</text><text x="82" y="98" fill="#B4BCC8" font-size="12">AI 코치</text>
    <line x1="0" y1="120" x2="390" y2="120" stroke="#252F3C"/>
    <rect x="150" y="140" width="216" height="62" rx="20" fill="#FF5A1F"/><text x="166" y="166" fill="#0B1018" font-size="14">금요일부터 일요일까지요.</text><text x="166" y="188" fill="#0B1018" font-size="14">여행 중에는 못 달려요</text>
    <rect x="24" y="218" width="260" height="62" rx="20" fill="#151C26" stroke="#252F3C"/><text x="40" y="244" fill="#F3F5F8" font-size="14">여행 기간은 비워 두고,</text><text x="40" y="266" fill="#F3F5F8" font-size="14">길게 달리기를 목요일로 옮길게요.</text>
    <rect x="16" y="296" width="358" height="378" rx="24" fill="#151C26" stroke="#334052"/>
    <text x="36" y="330" fill="#F3F5F8" font-size="17" font-weight="800">일정 변경 제안</text>
    <rect x="32" y="348" width="326" height="58" rx="14" fill="#0B1018"/><text x="48" y="372" fill="#F3F5F8" font-size="14" font-weight="700">길게 달리기 6km</text><text x="48" y="394" fill="#B4BCC8" font-size="13">토 11/21  →  목 11/19</text>
    <rect x="32" y="414" width="326" height="58" rx="14" fill="#0B1018"/><text x="48" y="438" fill="#F3F5F8" font-size="14" font-weight="700">가볍게 달리기 4km</text><text x="48" y="460" fill="#B4BCC8" font-size="13">목 11/19  →  생략</text>
    <text x="36" y="500" fill="#B4BCC8" font-size="13">이번 주 거리</text><text x="354" y="500" fill="#F3F5F8" font-size="14" text-anchor="end" font-weight="700">14km → 10km</text>
    <!-- 근거 한 줄 -->
    <rect x="32" y="514" width="326" height="58" rx="12" fill="#17253A"/>
    <circle cx="50" cy="533" r="7" fill="none" stroke="#8DBBFF" stroke-width="2"/><line x1="50" y1="530" x2="50" y2="535" stroke="#8DBBFF" stroke-width="2"/>
    <text x="64" y="538" fill="#8DBBFF" font-size="13" font-weight="700">이렇게 정한 근거</text>
    <text x="48" y="560" fill="#F3F5F8" font-size="12">최근 2주 평균 주 12km · 길게 달리기는 주 1회 유지</text>
    <rect x="32" y="586" width="326" height="36" rx="12" fill="#33290F"/><text x="48" y="609" fill="#FFC266" font-size="13">이번 주 훈련이 1회 줄어요</text>
    <rect x="32" y="632" width="156" height="32" rx="12" fill="#1E2733"/><text x="110" y="653" fill="#F3F5F8" font-size="13" text-anchor="middle" font-weight="700">다른 방법 보기</text>
    <rect x="200" y="632" width="158" height="32" rx="12" fill="url(#btn)"/><text x="279" y="653" fill="#0B1018" font-size="13" text-anchor="middle" font-weight="800">적용하기</text>
    <text x="195" y="704" fill="#7D8899" font-size="12" text-anchor="middle">근거 문구는 Training Engine 결과로만 만든다(AI-03)</text>
    <!-- 상황 칩 -->
    <g font-size="12" fill="#F3F5F8" text-anchor="middle">
      <rect x="16" y="720" width="108" height="30" rx="15" fill="#1E2733"/><text x="70" y="740">달력에서 보기</text>
      <rect x="132" y="720" width="122" height="30" rx="15" fill="#1E2733"/><text x="193" y="740">돌아오는 날 정하기</text>
      <rect x="262" y="720" width="112" height="30" rx="15" fill="#1E2733"/><text x="318" y="740">오늘 훈련 보기</text>
    </g>
    <rect x="16" y="762" width="290" height="44" rx="22" fill="none" stroke="#334052"/><text x="36" y="790" fill="#7D8899" font-size="14">메시지를 입력하세요</text>
    <circle cx="346" cy="784" r="22" fill="#3A2419"/>
    <text x="195" y="836" fill="#7D8899" font-size="12" text-anchor="middle">칩은 입력창만 채우고 자동 전송하지 않는다(F05-R14와 같은 방식)</text>
  </g>
</svg>
